<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--forest:#173527;--deep:#0d2518;--gold:#a98237;--cream:#f2ebdf;--paper:#fffdf9;--line:rgba(23,53,39,.16);--muted:#5a645c}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--deep);font:14px/1.5 Arial,sans-serif}.portal{padding:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--forest)}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:white}textarea{min-height:88px;resize:vertical}.drop{padding:22px;border:1.5px dashed rgba(169,130,55,.5);border-radius:18px;background:var(--paper);text-align:center}.drop input{border:0;padding:0}.note{font-size:12px;color:var(--muted);margin-top:7px}.consent{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:12px;color:var(--muted)}.consent input{width:auto;margin-top:2px}.btn{width:100%;min-height:48px;border:0;border-radius:999px;background:var(--forest);color:white;font-weight:700}.btn:disabled{opacity:.55}.status{display:none;margin-top:14px;padding:14px;border-radius:14px;background:var(--cream)}.status.show{display:block}.error{background:#f8e7e2;color:#7a2e21}.success{background:#e7f1e9;color:var(--forest)}.progress{height:8px;border-radius:999px;background:#e9e3d8;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s ease}@media(max-width:620px){.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="portal"><form id="uploadForm" class="form">
<div class="field"><label for="brand">Brand name</label><input id="brand" required></div><div class="field"><label for="product">Product name</label><input id="product" required></div>
<div class="field"><label for="email">Contact email</label><input id="email" type="email" required></div><div class="field"><label for="plan">Plan</label><select id="plan"><option>Bronze — CNP Verified</option><option>Silver — In-Silico Validated</option><option>Gold — Experimentally Validated</option></select><div class="note"><strong>Bronze and Silver:</strong> digital files only. <strong>Gold:</strong> samples are requested separately after protocol approval.</div></div>
<div class="field full"><label for="accessCode">Access code (only if provided by CNP)</label><input id="accessCode" autocomplete="off"></div>
<div class="field full"><label for="notes">Notes</label><textarea id="notes" placeholder="Add context about the dossier, claims or files."></textarea></div>
<div class="field full"><label>Files</label><div class="drop"><input id="files" type="file" multiple required><div class="note">Maximum 12 files; 8 MB per file. For larger files, include a secure cloud link in the notes.</div></div></div>
<div class="field full"><label class="consent"><input id="authorization" type="checkbox" required><span>I confirm that I am authorised to share these files and that I have removed personal data not necessary for the CNP assessment.</span></label></div><div class="field full"><label class="consent"><input id="privacyNotice" type="checkbox" required><span>I have read the CNP Data Protection Notice and understand that contact data and uploaded files will be used for the product assessment and related communication.</span></label></div>
<div class="field full"><button class="btn" id="submitButton" type="submit">Submit Your Product</button><div class="progress" id="progress" hidden><span id="progressBar"></span></div><div id="status" class="status"></div></div>
</form></div><script>
const form=document.getElementById('uploadForm'),statusBox=document.getElementById('status'),button=document.getElementById('submitButton'),progress=document.getElementById('progress'),progressBar=document.getElementById('progressBar');
function showStatus(message,type){statusBox.className='status show '+type;statusBox.textContent=message}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||'application/octet-stream',data:String(reader.result).split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file)})}
function callServer(functionName,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args)})}
form.addEventListener('submit',async e=>{e.preventDefault();const files=[...document.getElementById('files').files];if(!files.length){showStatus('Please select at least one file.','error');return}if(files.length>12){showStatus('Maximum 12 files per submission.','error');return}const tooLarge=files.find(f=>f.size>8*1024*1024);if(tooLarge){showStatus(`${tooLarge.name} exceeds the 8 MB limit.`,'error');return}button.disabled=true;button.textContent='Creating secure submission…';progress.hidden=false;progressBar.style.width='3%';showStatus('Preparing the secure Drive destination…','');try{const metadata={brand:document.getElementById('brand').value.trim(),product:document.getElementById('product').value.trim(),email:document.getElementById('email').value.trim(),plan:document.getElementById('plan').value,accessCode:document.getElementById('accessCode').value,notes:document.getElementById('notes').value.trim(),authorizationConfirmed:document.getElementById('authorization').checked,privacyNoticeAccepted:document.getElementById('privacyNotice').checked,privacyNoticeVersion:'2026-07-draft'};const started=await callServer('startSubmission',metadata);const uploaded=[];for(let i=0;i<files.length;i++){button.textContent=`Uploading ${i+1} of ${files.length}…`;showStatus(`Uploading ${files[i].name}…`,'');const encoded=await readFile(files[i]);uploaded.push(await callServer('uploadSubmissionFile',started.submissionId,encoded));progressBar.style.width=`${Math.round(((i+1)/files.length)*90)}%`}const result=await callServer('finishSubmission',started.submissionId,uploaded);progressBar.style.width='100%';showStatus(`Upload complete. ${result.fileCount} file(s) received by CNP.`,'success');form.reset()}catch(error){showStatus(error.message||String(error),'error')}finally{button.disabled=false;button.textContent='Submit Your Product';setTimeout(()=>{progress.hidden=true;progressBar.style.width='0'},1200)}});
</script></body></html>
